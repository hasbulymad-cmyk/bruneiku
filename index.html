<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>What Type of Bruneian Are You?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --y: #FFD100;
    --bg: #0C0C0C;
    --card: #141414;
    --border: #242424;
    --white: #F0F0F0;
    --dim: #555;
    --selected-bg: rgba(255,209,0,0.12);
    --selected-border: #FFD100;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--white);
    font-family: 'Space Grotesk', sans-serif;
    overflow-x: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100dvh;
    padding: 2rem 1.25rem 3rem;
  }

  /* ── Progress bar ── */
  .progress-bar {
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    background: var(--y);
    transition: width 0.4s cubic-bezier(.4,0,.2,1);
    z-index: 99;
  }

  /* ── Screens ── */
  .screen {
    width: 100%;
    max-width: 420px;
    display: none;
    flex-direction: column;
    gap: 1.5rem;
  }
  .screen.active { display: flex; }

  /* ── Intro screen ── */
  .intro-flag {
    font-size: 3.5rem;
    text-align: center;
    margin-bottom: 0.25rem;
    animation: bounce 1.5s ease infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-8px); }
  }

  .intro-title {
    font-size: clamp(1.6rem, 7vw, 2rem);
    font-weight: 700;
    text-align: center;
    line-height: 1.2;
    color: var(--white);
  }

  .intro-title span {
    color: var(--y);
    display: block;
  }

  .intro-sub {
    font-size: 0.85rem;
    color: var(--dim);
    text-align: center;
    line-height: 1.6;
  }

  /* ── Quiz screen ── */
  .q-number {
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--y);
  }

  .q-text {
    font-size: clamp(1.15rem, 5vw, 1.4rem);
    font-weight: 700;
    line-height: 1.35;
    color: var(--white);
  }

  .answers {
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
  }

  .answer-btn {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.9rem 1rem;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
    width: 100%;
    color: var(--white);
    font-family: 'Space Grotesk', sans-serif;
  }

  .answer-btn:active { transform: scale(0.98); }

  .answer-btn.selected {
    background: var(--selected-bg);
    border-color: var(--selected-border);
  }

  .answer-label {
    flex-shrink: 0;
    width: 1.6rem;
    height: 1.6rem;
    border-radius: 50%;
    background: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--dim);
    transition: background 0.15s, color 0.15s;
  }

  .answer-btn.selected .answer-label {
    background: var(--y);
    color: #000;
  }

  .answer-text {
    font-size: 0.88rem;
    line-height: 1.4;
    font-weight: 500;
  }

  /* ── Result screen ── */
  .result-emoji {
    font-size: 4rem;
    text-align: center;
    animation: pop 0.4s cubic-bezier(.175,.885,.32,1.275) both;
  }

  @keyframes pop {
    from { transform: scale(0.5); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }

  .result-label {
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--y);
    text-align: center;
  }

  .result-name {
    font-size: clamp(1.5rem, 7vw, 2rem);
    font-weight: 700;
    text-align: center;
    line-height: 1.2;
    color: var(--white);
  }

  .result-desc {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.1rem 1.25rem;
    font-size: 0.88rem;
    line-height: 1.65;
    color: #CCCCCC;
  }

  .result-accuracy {
    font-size: 0.72rem;
    color: var(--dim);
    text-align: center;
  }

  /* ── Buttons ── */
  .btn-primary {
    width: 100%;
    background: var(--y);
    color: #000;
    border: none;
    border-radius: 12px;
    padding: 1rem;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.88rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
  }

  .btn-primary:hover  { opacity: 0.9; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  .btn-secondary {
    width: 100%;
    background: transparent;
    color: var(--dim);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.85rem;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }

  .btn-secondary:hover { border-color: var(--dim); color: var(--white); }

  .btn-copy {
    width: 100%;
    background: transparent;
    color: var(--y);
    border: 1px solid rgba(255,209,0,0.3);
    border-radius: 12px;
    padding: 0.9rem;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }

  .btn-copy:hover { background: rgba(255,209,0,0.07); border-color: rgba(255,209,0,0.6); }
  .btn-copy.done  { color: #88FF88; border-color: rgba(136,255,136,0.4); }

  /* ── Screen slide transition ── */
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .screen.active { animation: slideIn 0.3s ease both; }

  /* ── Footer ── */
  .footer {
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    color: #333;
    text-transform: uppercase;
    text-align: center;
    margin-top: 0.5rem;
  }
</style>
</head>
<body>

<div class="progress-bar" id="progressBar" style="width:0%"></div>

<!-- ── Intro ── -->
<div class="screen active" id="screenIntro">
  <div class="intro-flag">🇧🇳</div>
  <div class="intro-title">What type of<span>Bruneian are you?</span></div>
  <div class="intro-sub">4 questions. brutally accurate. shareable result.<br>trust the process.</div>
  <button class="btn-primary" onclick="startQuiz()">Find Out →</button>
</div>

<!-- ── Quiz ── -->
<div class="screen" id="screenQuiz">
  <div class="q-number" id="qNumber">Question 1 of 4</div>
  <div class="q-text" id="qText"></div>
  <div class="answers" id="answersContainer"></div>
  <button class="btn-primary" id="btnNext" disabled onclick="nextQuestion()">Next →</button>
</div>

<!-- ── Result ── -->
<div class="screen" id="screenResult">
  <div class="result-emoji" id="resultEmoji"></div>
  <div class="result-label">You are...</div>
  <div class="result-name" id="resultName"></div>
  <div class="result-desc" id="resultDesc"></div>
  <div class="result-accuracy" id="resultAccuracy"></div>
  <button class="btn-copy" id="btnCopy" onclick="copyResult()">Copy Result for Threads</button>
  <button class="btn-secondary" onclick="restart()">Retake Quiz</button>
  <div class="footer">🇧🇳 bruneiku · share with your friends</div>
</div>

<script>
const questions = [
  {
    text: "it's saturday night. where are you?",
    answers: [
      { label: 'A', text: 'tapau nasi katok, home by 9pm 🍚', scores: [3,0,0,0,2,0,0,0] },
      { label: 'B', text: 'gadong / times square until they kick us out', scores: [0,0,0,0,0,2,1,0] },
      { label: 'C', text: 'same place i am every weekend... empire somehow 🏨', scores: [0,0,0,0,0,0,0,4] },
      { label: 'D', text: 'babe i\'m already at the airport lah', scores: [0,0,4,0,0,0,0,0] },
    ]
  },
  {
    text: "pick your brunei villain origin story",
    answers: [
      { label: 'A', text: 'stuck at jalan tutong roundabout. again. 🚗', scores: [0,4,0,0,0,0,0,0] },
      { label: 'B', text: 'shopee package held at customs for 3 weeks', scores: [0,0,0,4,0,0,0,0] },
      { label: 'C', text: 'went outside. immediately regretted it. too hot. 🥵', scores: [0,0,0,0,4,0,0,0] },
      { label: 'D', text: '"brunei is so boring" — some tourist who spent 2 hours here', scores: [0,0,0,0,0,0,4,0] },
    ]
  },
  {
    text: "honest review of living in brunei?",
    answers: [
      { label: 'A', text: '"boring but it\'s home 🥲 i would die without nasi katok"', scores: [2,0,0,0,1,0,1,0] },
      { label: 'B', text: '"actually underrated lowkey. people don\'t get it"', scores: [0,1,0,0,0,0,3,0] },
      { label: 'C', text: '"i love it but i need to leave every 3 months or i go insane"', scores: [0,0,3,0,0,1,0,0] },
      { label: 'D', text: '"jangan tanya 😶"', scores: [0,1,0,2,0,2,0,0] },
    ]
  },
  {
    text: "your most practiced skill in brunei?",
    answers: [
      { label: 'A', text: 'knowing which economy rice stall is open past midnight', scores: [1,0,0,0,0,3,0,0] },
      { label: 'B', text: 'tracking a shopee package across 4 countries in real time', scores: [0,0,0,3,0,0,0,0] },
      { label: 'C', text: 'planning the fastest route to avoid every single roundabout', scores: [0,3,0,0,0,0,1,0] },
      { label: 'D', text: 'identifying which mall has the best AC before entering', scores: [0,0,0,0,3,0,0,0] },
    ]
  }
];

const results = [
  {
    emoji: '🍚',
    name: 'The Nasi Katok Loyalist',
    desc: 'you are the backbone of the brunei economy. you have eaten nasi katok at 3AM more times than you\'ve slept before midnight. b$1 for a full meal? you believe in this. you will defend the humble katok against any food snob and honestly? you will WIN.',
    accuracy: '100% scientifically accurate. no notes.',
  },
  {
    emoji: '🚗',
    name: 'The Roundabout Philosopher',
    desc: 'you have spent so much time stuck at jalan tutong that you have achieved inner peace. you arrive everywhere exactly 20 minutes late and sincerely blame it on a roundabout that has existed since before you were born. this is not a personality flaw. this is a lifestyle.',
    accuracy: '97.3% accurate. the remaining 2.7% is still in traffic.',
  },
  {
    emoji: '✈️',
    name: 'The KL Countdown',
    desc: 'you are physically present in brunei but spiritually somewhere over the south china sea. your life only truly begins when airasia drops a promo. you\'ve already mentally packed for a trip that isn\'t booked yet. brunei is your charging port. kl is your actual battery.',
    accuracy: '99% accurate. you\'re reading this from mitsui outlet park aren\'t you.',
  },
  {
    emoji: '🛒',
    name: 'The Shopee/Temu Philosopher',
    desc: 'you have 47 items sitting in your cart right now. you know the exact shipping time from guangzhou to brunei muara. customs is your villain origin story — you think about it at night. but free shipping with no minimum? you feel joy. pure, unfiltered joy.',
    accuracy: '98% accurate. your package just cleared customs btw.',
  },
  {
    emoji: '❄️',
    name: 'The AC Purist',
    desc: 'you have engineered your entire existence around staying in air-conditioned spaces. step outside? for what. the sun hits and you\'re already heading back. brunei\'s 32°c weather is not weather, it is a personal attack. you are not thriving. you are surviving in controlled climate.',
    accuracy: '100% accurate. please drink water.',
  },
  {
    emoji: '🌙',
    name: 'The Midnight Katok Sage',
    desc: 'you are fully nocturnal. your social life does not begin before 10PM. you know which economy rice stall is still open at 2AM and this is your most valuable life skill. brunei by day? unfamiliar territory. brunei at night? that is YOUR brunei.',
    accuracy: '96% accurate. you opened this at 1AM didn\'t you.',
  },
  {
    emoji: '🗣️',
    name: 'The Brunei Defender',
    desc: 'someone says "brunei is boring" and you take it PERSONALLY. you have a memorised list of underrated spots, hidden gems, and reasons brunei is actually lowkey amazing — and you will share all of them, unsolicited. brunei does not need a PR team. it has you.',
    accuracy: '99% accurate. you\'ve already started typing a response to this.',
  },
  {
    emoji: '🏨',
    name: 'The Empire Mysterious',
    desc: 'no one knows how you afford this lifestyle and frankly you\'re not explaining. you are somehow at empire hotel every other weekend — the brunch, the pool, the gala dinner. you exist on a different plane of brunei experience. you are our most glamorous unsolved mystery.',
    accuracy: '95% accurate. see you at the sunday buffet.',
  },
];

let currentQ = 0;
let answers = [];
let scores = [0,0,0,0,0,0,0,0];
let selectedIndex = -1;

function setProgress(pct) {
  document.getElementById('progressBar').style.width = pct + '%';
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startQuiz() {
  currentQ = 0;
  scores = [0,0,0,0,0,0,0,0];
  answers = [];
  setProgress(5);
  show('screenQuiz');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQ];
  document.getElementById('qNumber').textContent = `Question ${currentQ + 1} of ${questions.length}`;
  document.getElementById('qText').textContent = q.text;
  selectedIndex = -1;
  document.getElementById('btnNext').disabled = true;

  const container = document.getElementById('answersContainer');
  container.innerHTML = '';

  q.answers.forEach((a, i) => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.innerHTML = `<div class="answer-label">${a.label}</div><div class="answer-text">${a.text}</div>`;
    btn.onclick = () => selectAnswer(i);
    container.appendChild(btn);
  });
}

function selectAnswer(i) {
  selectedIndex = i;
  document.querySelectorAll('.answer-btn').forEach((b, idx) => {
    b.classList.toggle('selected', idx === i);
  });
  document.getElementById('btnNext').disabled = false;
  document.getElementById('btnNext').textContent = currentQ === questions.length - 1 ? 'See My Result →' : 'Next →';
}

function nextQuestion() {
  if (selectedIndex === -1) return;

  const q = questions[currentQ];
  const s = q.answers[selectedIndex].scores;
  s.forEach((v, i) => scores[i] += v);

  currentQ++;
  const pct = Math.round((currentQ / questions.length) * 100);
  setProgress(pct);

  if (currentQ >= questions.length) {
    showResult();
  } else {
    renderQuestion();
  }
}

function showResult() {
  let best = 0;
  let bestIdx = 0;
  // tiebreak: pick a random one among tied top scores for variety
  const max = Math.max(...scores);
  const ties = scores.reduce((acc, v, i) => v === max ? [...acc, i] : acc, []);
  bestIdx = ties[Math.floor(Math.random() * ties.length)];

  const r = results[bestIdx];
  document.getElementById('resultEmoji').textContent = r.emoji;
  document.getElementById('resultName').textContent = r.name;
  document.getElementById('resultDesc').textContent = r.desc;
  document.getElementById('resultAccuracy').textContent = r.accuracy;

  const copyBtn = document.getElementById('btnCopy');
  copyBtn.textContent = 'Copy Result for Threads';
  copyBtn.classList.remove('done');

  setProgress(100);
  show('screenResult');

  // store for copy
  window._currentResult = r;
  window._currentResultIdx = bestIdx;
}

function copyResult() {
  const r = window._currentResult;
  const text = `i took the "what type of bruneian are you?" quiz and got...\n\n${r.emoji} ${r.name}\n\n"${r.desc.slice(0, 120)}..."\n\n${r.accuracy}\n\n🇧🇳 #Brunei #BruneiNetizen`;

  const done = () => {
    const btn = document.getElementById('btnCopy');
    btn.textContent = 'Copied! Paste on Threads 🇧🇳';
    btn.classList.add('done');
    setTimeout(() => {
      btn.textContent = 'Copy Result for Threads';
      btn.classList.remove('done');
    }, 3000);
  };

  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallback(text, done));
  } else {
    fallback(text, done);
  }
}

function fallback(text, cb) {
  const t = document.createElement('textarea');
  t.value = text;
  t.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
  document.body.appendChild(t);
  t.select();
  document.execCommand('copy');
  document.body.removeChild(t);
  cb();
}

function restart() {
  setProgress(0);
  show('screenIntro');
}
</script>
</body>
</html>
